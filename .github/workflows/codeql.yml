name: CodeQL

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger on any branch
  schedule:
    - cron: '0 6 * * 0' # Sunday at 6am UTC

permissions:
  security-events: write
  contents: read

jobs:
  # The SDK and runner label come from build/toolchains/net10-xcode26.json, the unprofiled lane.
  toolchains:
    name: Resolve toolchain profiles
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/toolchains
            build/scripts/ci

      - name: Resolve profile pins
        id: resolve
        run: python3 -B build/scripts/ci/toolchain_ci.py resolve --github-output profiles

  analyze:
    name: Analyze C#
    needs: toolchains
    runs-on: ${{ fromJSON(needs.toolchains.outputs.profiles)['net10-xcode26'].runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ fromJSON(needs.toolchains.outputs.profiles)['net10-xcode26'].sdk_version }}

      - name: Install workloads
        run: dotnet workload restore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build
        run: ./build.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
