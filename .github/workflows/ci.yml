name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger on any branch

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload restore

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Build and run tests
        timeout-minutes: 10
        run: dotnet nuke test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
          retention-days: 7

  bindingtests:
    name: BindingTests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload restore

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Build and test bindings (strict + coverage + baselines)
        run: dotnet nuke binding-tests --strict

      - name: Generate coverage report
        working-directory: BindingTests
        run: >
          python3 ../scripts/coverage-report.py
          --abi-json "$(find .build -name '*.abi.json' 2>/dev/null | head -1)"
          --binding-report output/binding-report.json

      - name: Run iOS Simulator tests
        timeout-minutes: 20
        run: >
          python3 scripts/ci/ci_ios_test.py
          --tier 2 --timeout 90 --skip-regen
          --step-timeout 1140

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-diagnostics
          path: /tmp/sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  package-smoke:
    name: Package Smoke Test
    runs-on: macos-26
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload restore

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Pack all NuGet packages
        run: dotnet nuke pack --version 0.0.0-smoke --output-dir /tmp/swift-nuget

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /tmp/swift-nuget/*.nupkg
          retention-days: 7
